services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: checkstock
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://checkstock:checkstock@db:5432/checkstock
      AUTO_SEED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
